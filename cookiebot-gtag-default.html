
<script data-cfasync="false" data-cookieconsent="ignore">
/*
    Web Site Advantage: CookieBot gtag default [v1.2] 
    Sets default consent states for manually added Coookiebot code. Don't use with GTM implementation
    https://bigcommerce.websiteadvantage.com.au/
    https://github.com/Tiggerito/BigCommerce/blob/main/cookiebot-gtag-default.html
    Copyright (C) 2024 Web Site Advantage
    {{!--

    Placement: Header
    Location: All pages
    Script category: Essential
    Script type: Script
    Script contents: this file, review any TODOs in the script and make modifications as needed
    --}}
*/
!function(w){

    // TODO: Update these settings as needed for your implementation
    var ads_data_redaction = true;
    var url_passthrough = true;

    var defaultSettings = {
        "ad_storage": "denied",
        "ad_user_data": "denied",
        "ad_personalization": "denied",
        "analytics_storage": "denied",
        "functionality_storage": "denied",
        "personalization_storage": "denied",
        "security_storage": "granted",
        "wait_for_update": 2000
    };

    // End of settings --------

    // https://support.cookiebot.com/hc/en-us/articles/360016047000-Cookiebot-and-Google-Consent-Mode

    if (!w.gtag) {        
        w.dataLayer = w.dataLayer || [];
        w.gtag = function (){w.dataLayer.push(arguments);}
    }

    w.gtag("consent", "default", defaultSettings);
    if (ads_data_redaction) w.gtag("set", "ads_data_redaction", true);
    if (url_passthrough) w.gtag("set", "url_passthrough", true); 

}(window)
</script>
