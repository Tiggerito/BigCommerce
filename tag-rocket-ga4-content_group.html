!function(w,t){
    w[t]=w[t]||{};var T=w[t];T.i=T.i||[];if(!T.init)T.init=function(f){T.i.push(f)};
    
    T.init(function() { 
      
        T.on('GtagCommandPending',function(data, eventName){

            if (data.arguments[0] === 'config' && data.arguments.length >= 3) {
                var options = data.arguments[2];

                // TODO: update how you set the options
                options.content_group = 'new_content_group';

                options.content_sub_group = 'new_custom_dimension';

            };         
        });
    })
}(window,"TagRocket")
</script>
