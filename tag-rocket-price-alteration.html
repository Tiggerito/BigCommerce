<script data-cfasync="false">   
/*
    Web Site Advantage: Tag Rocket Price Alteration [v1.0] 
    Alter a products price based on a custom field '__Real World Value'
    https://bigcommerce.websiteadvantage.com.au/tag-rocket/articles/tag-rocket-api/
    https://github.com/Tiggerito/BigCommerce/blob/main/tag-rocket-price-alteration.html
    Copyright (C) 2022 Web Site Advantage
    {{!-- 
    Add this script to the BigCommerce Script Manager using the following settings:

    Placement: Header
    Location: All pages
    Script category: Essential
    Script type: Script
    Script contents: this file, review any TODOs in the script and make modifications as needed
    --}}
*/
!function(w,t){
    w[t]=w[t]||{};var T=w[t];T.i=T.i||[];if(!T.init)T.init=function(f){T.i.push(f)};

    // TODO: Update the custom field name if required.

    var realWorldValueCustomField = '__Real World Value';

    // End of settings --------
    
    T.init(function() {

        T.on('ProductDataGathered',function(data, eventName){
            data.items.forEach(function(item){
                if (item.customFields){
                    item.customFields.forEach(function(customField){
                        if (customField.name == realWorldValueCustomField) {
                            var realWorldValue = Number(customField.value);

                            if (realWorldValue) {
                                item.price = realWorldValue;
                            }
                        }
                    });
                }

            });
        });
    })
}(window,"TagRocket")
</script>
