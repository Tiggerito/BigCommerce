<script data-cfasync="false">
/*
    Web Site Advantage: Tag Rocket gtag link tracking [v1.0] 
    Tracks links based on a CSS selector 
    https://bigcommerce.websiteadvantage.com.au/
    https://github.com/Tiggerito/BigCommerce/blob/main/tag-rocket-gtag-link-tracking.html
    Copyright (C) 2024 Web Site Advantage
    {{!-- 
    Add this script to the BigCommerce Script Manager using the following settings:

    Placement: Header
    Location: All pages
    Script category: Essential
    Script type: Script
    Script contents: this file, review any TODOs in the script and make modifications as needed
    --}}
*/
!function(w,d){

    // TODO: Update these settings.

    var linkCssSelector = '.navPages-action';

    var eventName = 'click_menu'; // lowercase, alphnumeric, underscores, no spaces

    var sendTo = 'GoogleAnalyticsFour'; // Tag Rocket will send this to your GA4 ID

    // End of settings --------

    var sendEvent = function(link) {
        gtag('event', eventName, {
            'link_url': link.href,
            'link_text': link.innerText,
            'send_to': sendTo
        });
    };

    window.onload = function() {
        var links = d.querySelectorAll(linkCssSelector);

        links.forEach(function(link) {
            link.addEventListener('click', function(event) {

                if (link.target === '_blank') {
                    // directly send event
                    sendEvent(link);
                } else {
                    w.addEventListener('beforeunload', function() {
                        sendEvent(link);
                    });
                }
            });
        }); 
    };
}(window, document)
</script>
