!function(w,t){
    w[t]=w[t]||{};var T=w[t];T.i=T.i||[];if(!T.init)T.init=function(f){T.i.push(f)};
    
    T.init(function() {

        // TODO: Add your own bot detectors to block

        // Example: Singapore bot blocker
        // Unfortunately BCs settings.country_code is not accurate and does not detect the Singapore bots as 'SG', so we can't limit via that.
        // Tag Rocket has Global Settings->Block Bots which uses another way to identify and block the Singapore bots.
        // https://bigcommerce.websiteadvantage.com.au/tag-rocket/bot-traffic-from-singapore/
        var ua = navigator.userAgent || '';
        var lang = navigator.language || '';
        var width = screen.width;
        var height = screen.height;

        if (
            /Macintosh/i.test(ua) &&
            /Chrome/i.test(ua) &&
            /^en-US$/i.test(lang) &&
            width === 1366 &&
            height === 1366
        ) {
            T.block = true;
        }
    })
}(window,"TagRocket")
</script>
