<script data-cfasync="false"> 
/*
    Web Site Advantage: Tag Rocket Disable order completed events [v1.0] 
    Don't track an order if it has a payment method of 'Apply for finance'
    https://bigcommerce.websiteadvantage.com.au/tag-rocket/articles/tag-rocket-api/
    https://github.com/Tiggerito/BigCommerce/blob/main/tag-rocket-stop-conversions-example.html
    Copyright (C) 2022 Web Site Advantage
    {{!-- 
    Add this script to the BigCommerce Script Manager using the following settings:

    Placement: Header
    Location: All pages
    Script category: Essential
    Script type: Script
    Script contents: this file, review any TODOs in the script and make modifications as needed
    --}}
*/  
    !function(w,t){
        w[t]=w[t]||{};var T=w[t];T.i=T.i||[];if(!T.init)T.init=function(f){T.i.push(f)};
        
        T.init(function() { 
       
            T.on('CheckoutStep5OrderCompleted',function(data, eventName){

                // TODO: Update the payment method to match your setup if different.
                
                if (data.paymentMethod === "Apply for finance") {
                   data.cancelBuiltInEvents = true;
                }               
            });
        })
    }(window,"TagRocket")
</script>
