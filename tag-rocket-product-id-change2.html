<script data-cfasync="false">   
/*
    Web Site Advantage: Tag Rocket Product ID Change 2 [v1.0] 
    Change certain product ItemIds
    https://bigcommerce.websiteadvantage.com.au/tag-rocket/articles/tag-rocket-api/
    https://github.com/Tiggerito/BigCommerce/blob/main/tag-rocket-product-id-change2.html
    Copyright (C) 2023 Web Site Advantage
    {{!-- 
    Add this script to the BigCommerce Script Manager using the following settings:

    Placement: Header
    Location: All pages
    Script category: Essential
    Script type: Script
    Script contents: this file, review any TODOs in the script and make modifications as needed
    --}}
*/
!function(w,t){
    w[t]=w[t]||{};var T=w[t];T.i=T.i||[];if(!T.init)T.init=function(f){T.i.push(f)};

    // TODO: Update the product IDs and destinations as required.

    var productIdsToChange = []; // enter the integer Product IDs that you want to alter

    var destinations = ["MicrosoftAds", "GoogleAds"];

    var changeItem = function(data) {
        if (
            (data.type === "ItemId" || data.type === "ItemGroupId") &&
            destinations.includes(data.destination) &&  
            productIdsToChange.includes(data.item.productId)            
        ) {
            // TODO: Update the transformation logic as required.
            data.value = '' + data.item.productId + '-2';
        }
    };

    T.init(function() {
        T.on('GetValue',function(data, eventName){
            changeItem(data);
        });
    })
}(window,"TagRocket")
</script>
